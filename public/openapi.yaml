openapi: 3.0.3
info:
  title: Identity Vault API
  description: 'Identity-as-a-Service: server-verified liveness, Home Affairs identity checks, behavioural fraud
    scoring, an explainable decision engine, a PayPal checkout gate and an advisory AI risk analyst. All amounts
    are ZAR integer cents.


    **Trust model (v2):** the server issues a random liveness challenge, validates the evidence and returns a single-use
    `verification_token`. `/api/transaction/approve` accepts only that token - never client-reported liveness or
    match results.


    **Auth:** secret keys (`ivk_...`, X-Api-Key) for servers; short-lived client tokens (`ivt_...`, Bearer) for
    browsers, minted via `/api/client-token`.'
  version: 2.0.0
servers:
- url: /
  description: Relative to wherever this app is deployed (works under both `php -S` and Apache/XAMPP subfolder deployments)
security:
- ApiKeyAuth: []
- ClientToken: []
tags:
- name: Identity
  description: Enrollment and biometric authentication
- name: Transactions
  description: Fraud-checked transaction approval
- name: Behavior
  description: Device/location baseline tracking and anomaly checks
- name: Admin
  description: Dashboard data endpoints
- name: Consent
  description: Explicit consent records required before DHA verification (per VerifyNow terms)
- name: Compliance
  description: POPIA data subject rights and retention policy
- name: Verification
  description: Server-issued liveness challenge -> verification token
- name: PayPal
  description: Identity-gated PayPal checkout
paths:
  /api/enroll:
    post:
      tags:
      - Identity
      summary: Enroll (or re-verify) a user. Requires a server-issued challenge; validates SA ID checksum and DOB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_number
              - full_name
              - dob
              - phone
              - image_base64
              - challenge_id
              properties:
                id_number: &id001
                  type: string
                full_name: *id001
                dob:
                  type: string
                  format: date
                phone: *id001
                challenge_id: *id001
                image_base64: *id001
                mode: &id003
                  type: string
                  enum:
                  - real
                  - simulated
                  description: simulated is refused unless ALLOW_SIMULATED_LIVENESS (dev only)
                actions: &id004
                  type: array
                  items:
                    type: object
                    properties:
                      action: *id001
                      completed:
                        type: boolean
                      t_ms: &id002
                        type: integer
                descriptors: &id005
                  type: array
                  description: 3-5 face-api.js 128-d descriptors sampled across the session
                  items:
                    type: array
                    items:
                      type: number
                duration_ms: *id002
                frames_analyzed: *id002
                behavior: &id006
                  type: object
                  description: Timing-only behavioural biometrics (never key contents)
                device_fingerprint: *id001
      responses:
        '200':
          description: Enrollment result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: enrolled
                  user_id:
                    type: integer
                  confidence:
                    type: number
                    format: float
                  message:
                    type: string
                  liveness:
                    $ref: '#/components/schemas/LivenessResult'
                  vault_match:
                    $ref: '#/components/schemas/VaultMatchResult'
        '422':
          description: Missing required fields
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/authenticate:
    post:
      tags:
      - Identity
      summary: Alias of /api/verify/session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - challenge_id
              - image_base64
              properties:
                user_id: *id002
                challenge_id: *id001
                image_base64: *id001
                mode: *id003
                actions: *id004
                descriptors: *id005
                duration_ms: *id002
                frames_analyzed: *id002
                behavior: *id006
                device_fingerprint: *id001
      responses:
        '200':
          description: Authentication result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - approved
                    - rejected
                    example: approved
                  confidence:
                    type: number
                    format: float
                    example: 0.92
                  message:
                    type: string
                    example: Biometric match successful
        '422':
          description: Missing fields or user not enrolled
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
        '429':
          description: Too many authentication attempts (rate limited)
  /api/transaction/approve:
    post:
      tags:
      - Transactions
      summary: Run the full decision pipeline with a verification_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - id_number
              - amount_cents
              - verification_token
              properties:
                user_id: *id002
                id_number: *id001
                amount_cents: *id002
                currency: *id001
                payee: *id001
                bank_partner_id: *id001
                verification_token: *id001
                selfie_base64: *id001
                realtime:
                  type: boolean
      responses:
        '200':
          description: 'Decision: status approved|flagged|rejected, score, threshold, required_action (step_up|manual_review|retry_verification),
            factors[], gates[], decision_id, signed receipt'
        '403':
          description: No consent, or token used/expired/for a different user/amount/payee
        '409':
          description: Idempotency-Key reuse conflict
        '422':
          description: verification_token missing, or id_number does not match the user
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema: *id001
        description: 'Required in production. Retries return the original response (Idempotent-Replay: true).'
  /api/behavior/update:
    post:
      tags:
      - Behavior
      summary: Set/refresh a user's device+location baseline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
                device_fingerprint:
                  type: string
                ip_country:
                  type: string
      responses:
        '200':
          description: Baseline updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
                  user_id:
                    type: integer
                  device_fingerprint:
                    type: string
                  ip_country:
                    type: string
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/fraud/check:
    get:
      tags:
      - Behavior
      summary: Standalone anomaly check against the stored baseline (no transaction recorded)
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: integer
      - name: device_fingerprint
        in: query
        schema:
          type: string
      - name: ip_country
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Anomaly + velocity flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  anomaly:
                    type: object
                    properties:
                      new_device:
                        type: boolean
                      ip_country_mismatch:
                        type: boolean
                      has_baseline:
                        type: boolean
                  velocity:
                    type: object
                    properties:
                      transactions_last_hour:
                        type: integer
                      flagged:
                        type: boolean
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/transactions:
    get:
      tags:
      - Admin
      summary: Recent transactions across all users (dashboard data)
      responses:
        '200':
          description: List of transactions
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/audit-log:
    get:
      tags:
      - Admin
      summary: Append-only audit trail (dashboard data)
      responses:
        '200':
          description: List of audit entries
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/webhook/notify/{transactionId}:
    post:
      tags:
      - Transactions
      summary: Fire the simulated bank API call (approved) or fraud alert (rejected/flagged) for a transaction
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Webhook fired
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum:
                    - bank_api_call
                    - fraud_alert_review
                  result:
                    type: string
        '404':
          description: Transaction not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/consent/grant:
    post:
      tags:
      - Consent
      summary: Record explicit consent for DHA verification (required before /api/transaction/approve)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - reason
              properties:
                user_id:
                  type: integer
                reason:
                  type: string
                  example: KYC identity verification for banking transaction
                validity_days:
                  type: integer
                  default: 365
                  minimum: 1
                  maximum: 3650
      responses:
        '200':
          description: Consent recorded
        '422':
          description: Missing/invalid fields
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/consent/status:
    get:
      tags:
      - Consent
      summary: Check a user's current consent status
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Consent status
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/consent/revoke:
    post:
      tags:
      - Consent
      summary: Revoke a user's active consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Revocation result
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/dha-verifications:
    get:
      tags:
      - Admin
      summary: Full (decrypted) bureau response history for one user - compliance/investigation use
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: DHA verification history, including the full raw bureau response
        '422':
          description: user_id query param missing
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/data-subject/export:
    get:
      tags:
      - Compliance
      summary: Full data export for a user (POPIA s23-24)
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Full export
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/data-subject/delete-request:
    post:
      tags:
      - Compliance
      summary: Process an erasure request (POPIA s25) - deletes what's deletable, reports what's retained and why
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: integer
      responses:
        '200':
          description: Erasure processed
        '404':
          description: User not found
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/admin/retention/run:
    post:
      tags:
      - Compliance
      summary: Run the configured retention policy on demand
      responses:
        '200':
          description: Retention run summary
        '401':
          description: Missing or invalid X-Api-Key header (only if API_KEY is configured on the server)
  /api/client-token:
    post:
      tags:
      - Verification
      summary: Mint a short-lived browser token (secret keys only)
      responses: &id007
        '200':
          description: OK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: *id002
                scopes:
                  type: array
                  items: *id001
  /api/verify/challenge:
    post:
      tags:
      - Verification
      summary: Issue a random single-use liveness challenge (optionally bound to an amount/payee)
      responses: *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: *id002
                amount_cents: *id002
                payee: *id001
  /api/verify/session:
    post:
      tags:
      - Verification
      summary: Submit liveness evidence; server validates, matches the vault and returns a single-use verification_token
      responses:
        '200':
          description: status approved|rejected; verification_token only when approved
        '422':
          description: Unknown/expired/used challenge
        '429':
          description: Too many failed attempts (lockout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - challenge_id
              - image_base64
              properties:
                user_id: *id002
                challenge_id: *id001
                image_base64: *id001
                mode: *id003
                actions: *id004
                descriptors: *id005
                duration_ms: *id002
                frames_analyzed: *id002
                behavior: *id006
                device_fingerprint: *id001
  /api/paypal/config:
    get:
      tags:
      - PayPal
      summary: PayPal mode and currency (no secrets)
      responses: *id007
  /api/paypal/orders:
    post:
      tags:
      - PayPal
      summary: Verify + decide; create a PayPal order ONLY if approved
      responses: *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              - id_number
              - amount_cents
              - verification_token
              properties:
                user_id: *id002
                id_number: *id001
                amount_cents: *id002
                verification_token: *id001
                payee: *id001
      parameters:
      - name: Idempotency-Key
        in: header
        schema: *id001
  /api/paypal/orders/{orderId}/capture:
    post:
      tags:
      - PayPal
      summary: Capture after buyer approval; refused without a valid signed approval receipt
      responses: *id007
      parameters:
      - name: orderId
        in: path
        required: true
        schema: *id001
  /api/paypal/webhook:
    post:
      tags:
      - PayPal
      summary: PayPal webhook receiver (verified via PayPal verify-webhook-signature)
      responses: *id007
      security: []
  /api/receipt/verify:
    post:
      tags:
      - Transactions
      summary: Verify a signed decision receipt
      responses: *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - receipt
              properties:
                receipt: *id001
  /api/admin/stats:
    get:
      tags:
      - Admin
      summary: Dashboard aggregates
      responses: *id007
  /api/admin/transactions/{id}:
    get:
      tags:
      - Admin
      summary: Factor-level breakdown of one decision
      responses: *id007
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/admin/transactions/{id}/explain:
    post:
      tags:
      - Admin
      summary: AI risk analyst explanation (advisory; PII-free input)
      responses: *id007
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
  /api/admin/audit/verify:
    get:
      tags:
      - Admin
      summary: Recompute the audit-log hash chain; reports the first broken entry
      responses: *id007
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Secret key (ivk_...) minted with bin/create-api-client.php. Scopes: verify, consent, transactions,
        data_subject, admin.'
    ClientToken:
      type: http
      scheme: bearer
      description: Short-lived browser token (ivt_...) from POST /api/client-token. Verification flow scopes only.
  schemas:
    LivenessResult:
      type: object
      properties:
        passed:
          type: boolean
        mode:
          type: string
          enum:
          - real
          - simulated
        reason:
          type: string
    VaultMatchResult:
      type: object
      properties:
        is_first_enrollment:
          type: boolean
        matched:
          type: boolean
        confidence:
          type: number
          format: float
        reason:
          type: string
